  <style>
    :root { --bg:#f4f7fb;--panel:#fff;--border:#e2e8f2;--text:#283245;--muted:#7d8ca2;--brand:#346fc4; }

    .layout{display:flex;height:100vh} .sidebar{width:360px;background:var(--panel);border-right:1px solid var(--border);overflow:auto;flex-shrink:0;padding:18px 0 40px;box-shadow:2px 0 14px rgba(40,60,120,.05)}

    .course{--course:#3b82f6;border-bottom:1px solid #edf1f6} .course-head{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;border-left:4px solid transparent;user-select:none} .course-head:hover,.course-head.active{background:#f6f9fe;border-left-color:var(--course)}

    .units{display:none;padding:3px 0 10px} .units.open{display:block} .unit{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:8px 16px 8px 23px} .unit:hover{background:#f8fafe} .num{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;background:#eef2f7;color:var(--muted);font-size:12px} .unit-title{font-size:13px;line-height:1.4}
    .buttons{display:flex;gap:5px} .buttons button{border:1px solid var(--border);border-radius:7px;background:#fff;padding:5px 7px;cursor:pointer;color:var(--text);font-size:12px} .buttons button:hover{color:#fff;background:var(--course);border-color:var(--course)}
    .content{flex:1;min-width:0;background:#fff} iframe{width:100%;height:100%;border:0;display:block} .empty{height:100%;display:grid;place-items:center;color:var(--muted)}
    @media(max-width:800px){.sidebar{width:310px}} @media(max-width:620px){body{overflow:auto}.layout{display:block;height:auto}.sidebar{width:100%;height:auto;max-height:55vh}.content{height:70vh}}
  
/* COLLAPSIBLE-SIDEBAR:START */
.sidebar { transition:width .25s ease,padding .25s ease; }
.sidebar-tools { display:flex; justify-content:flex-end; padding:0 14px 8px; }
.sidebar-toggle { width:32px; height:32px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--muted); cursor:pointer; font-weight:800; }
.sidebar-toggle:hover { color:var(--brand); background:#eef4ff; border-color:var(--brand); }
.unit-title { cursor:pointer; }
.unit-title:hover { color:var(--course); font-weight:700; }
.sidebar.collapsed { width:66px; padding-top:12px; overflow-x:hidden; }
.sidebar.collapsed .brand { display:none; }
.sidebar.collapsed .sidebar-tools { justify-content:center; padding:0 8px 10px; }
.sidebar.collapsed .course-name,.sidebar.collapsed .arrow,.sidebar.collapsed .units { display:none !important; }
.sidebar.collapsed .course-head { justify-content:center; padding:9px 7px; border-left:0; }
.sidebar.collapsed .course-code { min-width:44px; }
/* COLLAPSIBLE-SIDEBAR:END */

/* COMPACT-NAV:START */
.sidebar { width:300px; padding:18px 0 42px; transition:width .3s ease,padding .3s ease; }
.sidebar.collapsed { width:62px; overflow-x:hidden; }
.sidebar-title { display:flex; align-items:center; gap:9px; padding:6px 18px 15px; border-bottom:1px solid var(--border); white-space:nowrap; }
.sidebar-title .brand { flex:1; min-width:0; padding:0; border:0; gap:8px; }
.sidebar-title .brand img { width:104px; max-height:28px; }
.sidebar-title .brand strong { font-size:16px; }
.sidebar-title .sidebar-toggle { flex:0 0 30px; width:30px; height:30px; margin-left:auto; }
.unit { grid-template-columns:25px minmax(0,1fr); gap:9px; padding:9px 16px 9px 24px; cursor:pointer; }
.unit-title { font-size:13px; line-height:1.45; }
.sidebar.collapsed .sidebar-title { justify-content:center; padding:8px 7px 12px; }
.sidebar.collapsed .sidebar-title .brand { display:none; }
.sidebar.collapsed .sidebar-title .sidebar-toggle { margin:0; }
@media(max-width:800px) { .sidebar { width:280px; } }
@media(max-width:620px) { .sidebar { width:100%; } .sidebar.collapsed { width:62px; height:100vh; max-height:none; position:absolute; z-index:20; } }
/* COMPACT-NAV:END */
</style>
</head>

    courses.forEach((course,ci)=>{const group=document.createElement('section');group.className='course';group.style.setProperty('--course',course.color);const head=document.createElement('div');head.className='course-head'+(ci===0?' open active':'');head.innerHTML=`<span class="course-code">${course.code}</span><span class="course-name">${course.name}<br><span class="course-map">${course.map}</span></span><span class="arrow">▶</span>`;const list=document.createElement('div');list.className='units'+(ci===0?' open':'');course.units.forEach((u,i)=>{const row=document.createElement('div');row.className='unit';row.innerHTML=`<span class="num">${i+1}</span><span class="unit-title" title="点击查看知识">${u.title}</span>`;row.onclick=()=>openPage(u.knowledge);list.appendChild(row);});head.onclick=e=>{if(e.target.closest('button'))return;head.classList.toggle('open');head.classList.toggle('active');list.classList.toggle('open');};group.append(head,list);root.appendChild(group);}); openPage(courses[0].units[0].knowledge);
