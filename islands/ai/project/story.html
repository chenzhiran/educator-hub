<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作品创作故事</title>
    <style>
        :root {
            --bg-body: #0b0e1a;
            --bg-panel: rgba(255,255,255,0.06);
            --bg-panel-soft: rgba(255,255,255,0.035);
            --text-white: #ffffff;
            --text-main: #e5edf7;
            --text-gray: #94a3b8;
            --text-muted: #64748b;
            --gold: #ffc107;
            --gold-hover: #ffd65a;
            --gold-soft: rgba(255,193,7,0.16);
            --pink: #f472b6;
            --green: #34d399;
            --cyan: #22d3ee;
            --line: rgba(255,255,255,0.1);
            --shadow: 0 30px 80px rgba(0,0,0,0.42);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 8%, rgba(244,114,182,0.12), transparent 28%),
                radial-gradient(circle at 86% 18%, rgba(34,211,238,0.12), transparent 26%),
                linear-gradient(180deg, #0f1422 0%, var(--bg-body) 55%, #080a12 100%);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.8;
        }

        a { color: inherit; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 14px 32px;
            background: rgba(11,14,26,0.86);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(14px);
        }

        .brand {
            color: var(--gold);
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
        }

        .back-link {
            color: var(--text-gray);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--gold); }

        .page {
            width: min(1280px, calc(100% - 48px));
            margin: 42px auto 80px;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(280px, 0.88fr) minmax(0, 1.12fr);
            gap: 34px;
            align-items: start;
        }

        .poster-panel {
            position: sticky;
            top: 86px;
        }

        .poster-wrap {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #101522;
            box-shadow: var(--shadow);
        }

        .poster-wrap img {
            display: block;
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .poster-caption {
            padding: 18px 20px 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.035));
        }

        .work-name {
            margin: 0;
            color: #fff;
            font-size: 25px;
            line-height: 1.25;
        }

        .meta-line {
            margin: 8px 0 0;
            color: var(--text-gray);
            font-size: 14px;
        }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 11px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            color: #dbeafe;
            background: rgba(96,165,250,0.12);
            font-size: 12px;
            font-weight: 800;
        }

        .start-box {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid rgba(255,193,7,0.22);
            border-radius: 12px;
            background: var(--gold-soft);
        }

        .start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 50px;
            border-radius: 10px;
            background: var(--gold);
            color: #111827;
            font-size: 17px;
            font-weight: 900;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .start-btn:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(255,193,7,0.26);
        }

        .article {
            min-width: 0;
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--gold-soft);
            color: var(--gold);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(31px, 4.2vw, 54px);
            line-height: 1.18;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 16px 0 0;
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.75;
        }

        .story-card {
            margin-top: 30px;
            padding: 30px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--bg-panel);
            box-shadow: 0 18px 60px rgba(0,0,0,0.2);
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            margin-bottom: 18px;
            padding: 5px 13px;
            border-radius: 999px;
            background: rgba(244,114,182,0.14);
            color: var(--pink);
            font-size: 12px;
            font-weight: 900;
        }

        .story-text p,
        .parent-note p {
            margin: 0 0 18px;
            color: var(--text-main);
            font-size: 16px;
            line-height: 2;
        }

        .story-text p:last-child,
        .parent-note p:last-child {
            margin-bottom: 0;
        }

        .parent-card {
            margin-top: 24px;
            padding: 24px 26px;
            border: 1px solid rgba(52,211,153,0.22);
            border-radius: 12px;
            background: rgba(52,211,153,0.075);
        }

        .parent-card .section-label {
            background: rgba(52,211,153,0.13);
            color: var(--green);
        }

        .bottom-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--text-main);
            background: var(--bg-panel-soft);
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .secondary-btn:hover {
            border-color: rgba(255,193,7,0.44);
            color: var(--gold);
        }

        .sticky-start {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 30;
            display: none;
            min-width: 142px;
            min-height: 48px;
            border-radius: 999px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.34);
        }

        .empty {
            max-width: 680px;
            margin: 110px auto;
            padding: 34px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--bg-panel);
            text-align: center;
        }

        .empty h1 { font-size: 30px; }
        .empty p { color: var(--text-gray); }

        @media (max-width: 900px) {
            .topbar { padding: 12px 18px; }
            .page {
                width: min(100% - 28px, 720px);
                margin-top: 28px;
            }
            .hero { grid-template-columns: 1fr; }
            .poster-panel { position: static; }
            .story-card { padding: 22px 18px; }
            .parent-card { padding: 20px 18px; }
            .sticky-start { display: flex; }
        }

        @media (max-width: 520px) {
            .brand { font-size: 13px; }
            .back-link { font-size: 13px; }
            .work-name { font-size: 22px; }
            .subtitle { font-size: 15px; }
            .story-text p,
            .parent-note p {
                font-size: 15px;
                line-height: 1.9;
            }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="index.html">扣哒宇宙学生作品展</a>
        <a class="back-link" href="index.html">返回全部作品</a>
    </nav>

    <main class="page" id="page">
        <section class="hero">
            <aside class="poster-panel">
                <div class="poster-wrap">
                    <img id="poster" src="" alt="">
                    <div class="poster-caption">
                        <h2 class="work-name" id="workName"></h2>
                        <p class="meta-line" id="metaLine"></p>
                        <div class="badge-row" id="badgeRow"></div>
                    </div>
                </div>
                <div class="start-box">
                    <a class="start-btn" id="startGameTop" href="#">开始玩</a>
                </div>
            </aside>

            <article class="article">
                <span class="kicker">创作故事</span>
                <h1 id="pageTitle"></h1>
                <p class="subtitle" id="pageSubtitle"></p>

                <section class="story-card">
                    <span class="section-label">我的创作故事</span>
                    <div class="story-text" id="storyText"></div>
                </section>

                <section class="parent-card" id="parentCard">
                    <span class="section-label" id="parentTitle"></span>
                    <div class="parent-note" id="parentNote"></div>
                </section>

                <div class="bottom-actions">
                    <a class="start-btn" id="startGameBottom" href="#">开始玩</a>
                    <a class="secondary-btn" href="index.html">回到作品列表</a>
                </div>
            </article>
        </section>
    </main>

    <a class="start-btn sticky-start" id="startGameSticky" href="#">开始玩</a>

    <script src="story-data.js"></script>
    <script>
        const projects = window.STUDENT_PROJECT_STORIES || [];
        const params = new URLSearchParams(window.location.search);
        const requestedId = params.get('id') || window.location.hash.replace(/^#/, '');
        const project = projects.find(item => item.id === requestedId) || projects[0];

        function setText(id, value) {
            document.getElementById(id).textContent = value || '';
        }

        function setParagraphs(id, lines) {
            const box = document.getElementById(id);
            box.innerHTML = '';
            (lines || []).forEach(line => {
                const p = document.createElement('p');
                p.textContent = line;
                box.appendChild(p);
            });
        }

        function setStartLinks(href) {
            ['startGameTop', 'startGameBottom', 'startGameSticky'].forEach(id => {
                document.getElementById(id).setAttribute('href', href);
            });
        }

        function showEmpty() {
            document.title = '未找到作品';
            document.getElementById('page').innerHTML = `
                <section class="empty">
                    <h1>没有找到这个作品</h1>
                    <p>作品故事可能还没有配置，回到作品列表重新选择一个作品。</p>
                    <div class="bottom-actions" style="justify-content:center">
                        <a class="secondary-btn" href="index.html">回到作品列表</a>
                    </div>
                </section>
            `;
            document.getElementById('startGameSticky').style.display = 'none';
        }

        if (!project) {
            showEmpty();
        } else {
            const gameHref = `${project.id}/${project.file}`;
            document.title = `${project.name} - 创作故事`;
            document.getElementById('poster').src = project.img;
            document.getElementById('poster').alt = `${project.name}作品海报`;
            setText('workName', project.name);
            setText('metaLine', `${project.dev} · ${project.age} · 历时 ${project.learning}`);
            setText('pageTitle', project.pageTitle);
            setText('pageSubtitle', project.pageSubtitle);
            setParagraphs('storyText', project.story);
            setStartLinks(gameHref);

            const badgeRow = document.getElementById('badgeRow');
            [project.type, project.stage, project.age, `用时 ${project.learning}`].forEach(text => {
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = text;
                badgeRow.appendChild(badge);
            });

            if (project.parentNote && project.parentNote.length) {
                setText('parentTitle', project.parentTitle || '写给爸爸妈妈的话：');
                setParagraphs('parentNote', project.parentNote);
            } else {
                document.getElementById('parentCard').style.display = 'none';
            }
        }
    </script>
</body>
</html>
