<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">水火箭实验室海报</title><desc id="desc">一枚真实水火箭从校园试验场起飞，周围展示水量、气压、角度与飞行轨迹。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9efff"/><stop offset=".52" stop-color="#eefaff"/><stop offset="1" stop-color="#fff7df"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72c878"/><stop offset="1" stop-color="#27895e"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#effaff" stop-opacity=".9"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#9cecff" stop-opacity=".9"/><stop offset="1" stop-color="#22a9d4" stop-opacity="0"/></linearGradient>
