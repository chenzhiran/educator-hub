<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铿锵！废铁试炼场</title>
<link rel="stylesheet" href="style.css">
<script defer src="game.js"></script>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="废铁试炼场第一人称游戏画面"></canvas>
  <canvas id="effects" aria-hidden="true"></canvas>
  <div class="screen-grain"></div>
  <section id="hud" hidden aria-label="战斗状态">
    <aside class="radar"><canvas id="map" width="126" height="126"></canvas><small>战区雷达 / RADAR</small></aside>
    <div class="mission"><div class="kicker" id="stage">SECTOR 01 / 03</div><b id="objective"></b><div id="bossTrack" hidden><i id="bossBar"></i></div></div>
    <aside class="stats"><div id="timer">00:00</div><small id="score">00000 分</small></aside>
    <div class="health status"><small>结构完整度 / INTEGRITY</small><strong id="hp">100</strong><div class="track"><i id="healthBar"></i></div></div>
    <div class="ammo status"><small id="weapon"></small><div><strong id="rounds"></strong><span id="capacity"></span></div><small id="gunHint">R 装填 · 1 / 2 切枪</small></div>
    <div id="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="announcement" class="announcement" hidden></div>
    <div id="damage"></div>
  </section>
  <section id="home" class="home">
    <div class="menu-top"><span class="brand"><i></i> SCRAP DIVISION</span><span>单人街机 · 01 / 03</span></div>
    <div class="cover-copy">
      <div class="eyebrow"><span>任务档案</span> <b>NO. 007</b> <i></i> 沙海工业带</div>
      <h1>CLANG<span>!</span></h1>
      <div class="subtitle">铿锵！废铁试炼场</div>
      <p>废料场的机器拒绝报废。<br>穿过三个战区，把最后一台也送回熔炉。</p>
      <div class="play-row"><button id="start" class="action">开始试炼 <span>↗</span></button><small>三段交火<br>约 5 分钟</small></div>
    </div>
    <div class="menu-bottom"><div class="controls"><span><kbd>WASD</kbd> 移动</span><span><kbd>鼠标</kbd> 瞄准 / 射击</span><span><kbd>R</kbd> 装填</span><span><kbd>SHIFT</kbd> 冲刺</span><span><kbd>ESC</kbd> 暂停</span></div><b>001 — THE SCRAPYARD</b></div>
  </section>
  <section id="overlay" class="overlay" hidden aria-live="polite">
    <div class="panel">
      <div class="kicker" id="panelTag"></div>
      <h2 id="panelTitle"></h2>
      <p id="panelText"></p>
      <div id="cards" class="cards" hidden></div>
      <div id="panelActions" class="panel-actions">
        <button id="continue" class="action"></button>
        <button id="menu" class="secondary">返回封面</button>
      </div>
    </div>
  </section>
  <button id="mute" class="mute" aria-pressed="false">音效 ON</button>
</main>
</body>
</html>
